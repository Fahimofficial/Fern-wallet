name: Set up JDK and Gradle
description: >
  Temurin JDK 21 and Gradle for Fern Wallet builds. setup-gradle also validates every
  gradle-wrapper.jar in the repository against Gradle's published checksums before any
  ./gradlew call. Caches are written only from main; other refs read them.

inputs:
  cache:
    description: "'default' (read-write on main, read-only elsewhere) or 'disabled' (release builds)"
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        # JDK that runs Gradle (Paparazzi 2 needs 21+). App bytecode targets `jvm-target` in gradle/libs.versions.toml.
        java-version: '21'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        # Open-source caching (actions/cache) instead of the default proprietary provider.
        cache-provider: basic
        cache-disabled: ${{ inputs.cache == 'disabled' }}
        add-job-summary: on-failure
