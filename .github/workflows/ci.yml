name: CI

# Main-branch validation: the same checks as PR validation, run on the integrated result
# of every merge. Only these runs write the Gradle and AVD caches that PR runs read.
# release.yml refuses to build a tag unless this workflow passed for the tagged commit.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Every main commit gets a complete result (releases depend on it), so never cancel.
  cancel-in-progress: false

jobs:
  android:
    name: Android checks
    uses: ./.github/workflows/android-checks.yml
    permissions:
      contents: read
