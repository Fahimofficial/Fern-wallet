name: Release

# Builds, signs, verifies and drafts a GitHub release when a version tag is pushed.
#
#   Stable:     v2026.10.27        (tag == "v" + version-name)
#   Prerelease: v2026.10.27-rc.1   (any "-suffix" marks a prerelease)
#
# The release is created as a DRAFT. A maintainer reviews the notes and artifacts and
# publishes it manually. See docs/Releasing.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & draft release
    runs-on: ubuntu-latest
    environment: release # optional: add required reviewers for this environment in repo settings
    permissions:
      contents: write # create the draft release & upload assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag against version catalog
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep -E '^version-name *=' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -E '^version-code *=' gradle/libs.versions.toml | sed -E 's/.*"(.*)".*/\1/')
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          if [ "$BASE" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match version-name $VERSION_NAME in gradle/libs.versions.toml"
            exit 1
          fi
          PRERELEASE=false
          case "$TAG" in *-*) PRERELEASE=true ;; esac
          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "prerelease=$PRERELEASE"
            echo "artifact_base=FernWallet-${TAG#v}-$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Check signing secrets are configured
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for v in SIGNING_KEYSTORE SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Refusing to publish an unsigned or debug-signed build."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEYSTORE" | base64 -d > "$KEYSTORE"
          echo "SIGNING_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build signed release APK & AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify artifacts
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose "$APK"
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep "certificate DN")
          echo "$CERT"
          if echo "$CERT" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is signed with a debug certificate"; exit 1
          fi
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -q "package: name='com.fernwallet.app' versionCode='${{ steps.version.outputs.version_code }}' versionName='${{ steps.version.outputs.version_name }}'" \
            || { echo "::error::APK identity/version mismatch"; echo "$BADGING" | head -1; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Fern Wallet'" \
            || { echo "::error::Unexpected app label"; exit 1; }

      - name: Collect artifacts & checksums
        run: |
          mkdir -p dist
          BASE="${{ steps.version.outputs.artifact_base }}"
          cp app/build/outputs/apk/release/app-release.apk "dist/$BASE.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$BASE.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/$BASE-mapping.txt"
          (cd dist && sha256sum "$BASE.apk" "$BASE.aab" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact_base }}
          path: dist/
          retention-days: 30

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="${{ steps.version.outputs.artifact_base }}"
          FLAGS="--draft --verify-tag --generate-notes"
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then FLAGS="$FLAGS --prerelease"; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::Release $GITHUB_REF_NAME already exists. Delete it (and the tag) to rebuild."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" $FLAGS \
            --title "Fern Wallet ${GITHUB_REF_NAME#v}" \
            "dist/$BASE.apk" "dist/$BASE.aab" "dist/SHA256SUMS.txt"
          # mapping.txt is kept as a workflow artifact only (needed to deobfuscate crash traces).
