name: Security

# Secret scanning of the full git history and known-vulnerability scanning of the dependencies
# that ship in the release APK. Severity policy and exception process: docs/SECURITY.md.
# SAST lives in codeql.yml, workflow security in workflow-audit.yml, new-dependency review in
# dependency-review.yml, and Android manifest/APK policy in android-checks.yml.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, to catch newly published advisories for unchanged dependencies.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  OSV_SCANNER_VERSION: 2.7.0
  OSV_SCANNER_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b

jobs:
  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # --redact keeps secret values out of the log and the report. Historical findings that
      # are already handled are listed by exact fingerprint in .gitleaksignore.
      - name: Scan all commits
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 \
            --gitleaks-ignore-path .gitleaksignore \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" .
          status=$?
          set -e
          python3 - "$RUNNER_TEMP/gitleaks.json" <<'EOF'
          import json, os, sys
          findings = json.load(open(sys.argv[1])) if os.path.getsize(sys.argv[1]) else []
          lines = [f"| {f['RuleID']} | `{f['File']}:{f['StartLine']}` | `{f['Commit'][:12]}` | {f['Date'][:10]} |" for f in findings]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              if findings:
                  s.write(f"### ❌ gitleaks: {len(findings)} possible secret(s)\n\n| Rule | Location | Commit | Date |\n|---|---|---|---|\n")
                  s.write("\n".join(lines) + "\n\n")
                  s.write("Values are redacted. A committed secret must be **revoked/rotated** by its owner; "
                          "removing it from the tree does not invalidate it. See docs/SECURITY.md.\n")
              else:
                  s.write("### ✅ gitleaks: no new secrets in git history\n")
          for f in findings:
              print(f"::error file={f['File']},line={f['StartLine']},title=Possible secret ({f['RuleID']})::commit {f['Commit'][:12]}; value redacted")
          EOF
          exit "$status"

  dependencies:
    name: Dependency vulnerabilities (OSV, release classpath)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build

      - name: Generate SBOM of the release runtime classpath (CycloneDX)
        run: ./gradlew :app:cyclonedxDirectBom

      - name: Install osv-scanner (checksum-verified)
        run: |
          curl -fsSLo "$RUNNER_TEMP/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/osv-scanner"

      # Blocking on main, on the schedule and in release.yml. On pull requests it only reports,
      # so a newly published advisory for an existing dependency doesn't block unrelated PRs;
      # dependency-review.yml blocks PRs that *add* vulnerable dependencies.
      - name: Scan app dependencies
        env:
          ADVISORY: ${{ github.event_name == 'pull_request' && '--advisory' || '' }}
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml \
            -L app/build/reports/cyclonedx-direct/bom.json --format json --output-file osv-app.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then echo "::error::osv-scanner failed (exit $status)"; exit "$status"; fi
          # shellcheck disable=SC2086 # ADVISORY is empty or a single flag
          python3 scripts/ci/osv_gate.py osv-app.json --title "App dependencies (release runtime classpath)" $ADVISORY

      # fastlane (Gemfile.lock) is local release tooling that no workflow runs and the APK
      # doesn't contain, so it is reported but never blocks.
      - name: Scan Ruby tooling (Gemfile.lock, advisory)
        run: |
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source --config osv-scanner.toml -L Gemfile.lock \
            --format json --output-file osv-ruby.json
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then echo "::error::osv-scanner failed (exit $status)"; exit "$status"; fi
          python3 scripts/ci/osv_gate.py osv-ruby.json --title "Ruby release tooling (advisory)" --advisory

      - name: Upload SBOM and scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-and-vulnerability-reports
          path: |
            app/build/reports/cyclonedx-direct/bom.json
            osv-*.json
          if-no-files-found: ignore
          retention-days: 14
