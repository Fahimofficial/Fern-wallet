name: Prepare release

# Manually triggered. Bumps version-name (today's UTC date, YYYY.MM.DD) and version-code (+1)
# in gradle/libs.versions.toml and opens a PR. After merging, push the tag `v<version-name>`
# to build the signed draft release (see .github/workflows/release.yml and docs/Releasing.md).
#
# No workflow inputs by design: the release version is derived only from the date, so the build
# output can't be influenced by user-supplied parameters (CKV_GHA_7 / SLSA build integrity).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bump version in libs.versions.toml
        id: bump
        run: |
          FILE=gradle/libs.versions.toml
          NAME="$(date -u +'%Y.%m.%d')"
          CODE=$(grep -E '^version-code *=' $FILE | sed -E 's/.*"(.*)".*/\1/')
          NEW_CODE=$((CODE + 1))
          sed -i -E "s/^version-name = \".*\"/version-name = \"$NAME\"/" $FILE
          sed -i -E "s/^version-code = \".*\"/version-code = \"$NEW_CODE\"/" $FILE
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Release: v${{ steps.bump.outputs.name }} (${{ steps.bump.outputs.code }})"
          base: main
          branch: release/v${{ steps.bump.outputs.name }}
          title: "Release: v${{ steps.bump.outputs.name }} (${{ steps.bump.outputs.code }})"
          body: |
            Bumps `version-name` to `${{ steps.bump.outputs.name }}` and `version-code` to `${{ steps.bump.outputs.code }}`.

            After merging, tag the merge commit to build the signed draft release:
            ```
            git tag v${{ steps.bump.outputs.name }} && git push origin v${{ steps.bump.outputs.name }}
            ```
          labels: release
          delete-branch: true
